<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0A0B0C; }
  body { display: grid; place-items: center; }
  /* 12% safe padding each side -> mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- family mark: the vitalsheet LCD readout, with the "explained" play chevron -->
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#34D6C0" stroke-width="2.5"/>
    <text x="30" y="27" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" font-weight="800" fill="#4FEAD2">120</text>
    <text x="30" y="49" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" font-weight="800" fill="#4FEAD2">80</text>
    <line x1="17" y1="33.5" x2="43" y2="33.5" stroke="#45494f" stroke-width="2" stroke-linecap="round"/>
    <path d="M47 26l9 6-9 6z" fill="#34D6C0"/>
  </svg>
</body>
</html>
