<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #101113; --panel: #0A0B0C; --lcd: #4FEAD2; --accent: #34D6C0;
    --text: #ECEAE4; --muted: #A7ADB4; --line: #2E333A; --outside: #F0B429;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: var(--sans); color: var(--text);
    background:
      radial-gradient(900px 520px at 82% -10%, rgba(52,214,192,0.12), transparent 60%),
      linear-gradient(180deg, #0d0e10 0%, #101113 100%);
    -webkit-font-smoothing: antialiased;
  }
  .grid { position: absolute; inset: 0; opacity: 0.35;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px; -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%, #000 60%, transparent); }
  .frame { position: absolute; inset: 0; padding: 60px 76px; display: flex; flex-direction: column; justify-content: space-between; }

  .brand { display: flex; align-items: center; gap: 18px; }
  .logo { width: 62px; height: 62px; border-radius: 15px; background: var(--panel); border: 1px solid #23262B;
    display: flex; align-items: center; justify-content: center; }
  .logo span { font-family: var(--mono); font-weight: 800; font-size: 21px; color: var(--lcd); text-shadow: 0 0 12px rgba(79,234,210,0.5); line-height: 1.05; text-align: center; }
  .wordmark { font-size: 48px; font-weight: 800; letter-spacing: -0.035em; }
  .wordmark em { font-style: normal; font-weight: 500; color: var(--muted); }

  .center { display: flex; align-items: center; gap: 40px; }
  .flow { display: flex; align-items: center; gap: 20px; flex: none; }
  .readout { background: var(--panel); border: 1px solid #23262B; border-radius: 20px;
    padding: 26px 30px; box-shadow: inset 0 0 50px rgba(0,0,0,0.7); text-align: center; }
  .readout .big { font-family: var(--mono); font-weight: 800; font-size: 84px; line-height: 1;
    color: var(--lcd); letter-spacing: 0.02em; text-shadow: 0 0 26px rgba(79,234,210,0.4); }
  .readout .big .slash { color: #45494f; text-shadow: none; }
  .readout .unit { margin-top: 12px; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: #7f868d; }
  .arrow { font-size: 54px; color: var(--accent); font-weight: 800; }
  .sheet { background: #F6F5F1; color: #17181A; border-radius: 12px; width: 188px; padding: 18px 20px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,0.8); }
  .sheet .t { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px; }
  .sheet .l { height: 10px; border-radius: 5px; background: #E6E4DC; margin: 10px 0; }
  .sheet .l.avg { background: rgba(12,126,112,0.35); outline: 2px solid #0C7E70; }
  .sheet .a { margin-top: 12px; font-family: var(--mono); font-weight: 800; font-size: 24px; color: #0C7E70; }

  .headline { flex: 1; min-width: 0; }
  .headline h1 { font-size: 38px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.12; }
  .headline h1 em { font-style: normal; color: var(--accent); }
  .headline p { margin-top: 14px; font-size: 20px; color: var(--muted); line-height: 1.35; }
  .headline p code { font-family: var(--mono); color: var(--lcd); font-size: 19px; }

  .chips { display: flex; gap: 12px; }
  .chip { display: inline-flex; align-items: center; gap: 9px; padding: 11px 20px; border: 1px solid var(--line);
    border-radius: 999px; font-size: 21px; font-weight: 600; color: var(--muted); }
  .chip b { color: var(--accent); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <div class="brand">
      <div class="logo"><span>120<br>80</span></div>
      <div class="wordmark">vitalsheet <em>explained</em></div>
    </div>

    <div class="center">
      <div class="flow">
        <div class="readout">
          <div class="big">120<span class="slash">/</span>80</div>
          <div class="unit">mmHg</div>
        </div>
        <div class="arrow">&rarr;</div>
        <div class="sheet">
          <div class="t">Trend sheet</div>
          <div class="l"></div>
          <div class="l"></div>
          <div class="l avg"></div>
          <div class="a">avg 124/82</div>
        </div>
      </div>
      <div class="headline">
        <h1>How your readings become <em>one clinic-ready sheet.</em></h1>
        <p>The animated walkthrough — and why <code>connect-src 'none'</code> means nothing can leave your device.</p>
      </div>
    </div>

    <div class="chips">
      <span class="chip"><b>Step-by-step</b> animation</span>
      <span class="chip"><b>Enforced</b> privacy, not promised</span>
      <span class="chip"><b>Free</b> — no sign-up</span>
    </div>
  </div>
</body>
</html>
